name: Publish to NPM/GPR
on:
  release:
    types: [published]

jobs:
  publish:
    environment: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write

    name: Publish
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: NPM Install
        run: npm ci

      - name: Publish (NPM)
        run: npm stage publish

      - uses: actions/setup-node@v7
        with:
          registry-url: 'https://npm.pkg.github.com'

      - name: Publish (GPR)
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
